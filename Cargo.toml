[package]
name = "mosaik-capture"
version = "1.1.0"
edition = "2024"
rust-version = "1.87"
description = "Windows tray host for screenshots and screen recordings: global hotkeys, settings window and capture-engine launcher."
license = "MIT"
repository = "https://github.com/Mosaik114/mosaik-capture"
publish = false
autotests = false  # tests/ holds the C# engine tests

[[bin]]
name = "MosaikCapture"
path = "src/main.rs"

[dependencies]
# Stay on 0.59: 0.60+ links through raw-dylib and needs `dlltool` on the GNU toolchain.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Only the tests read contract/contract.json; the shipped program keeps a single dependency.
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
