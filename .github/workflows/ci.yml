name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job may write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  rust:
    name: Rust tray app (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      # Actions pinned to a commit SHA; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy (pedantic, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      # --include-ignored also runs the end-to-end test of the real settings window
      # (own window class, temp settings, unusual hotkeys)
      - name: cargo test (incl. the settings-window end-to-end test)
        run: cargo test --locked -- --include-ignored
      - name: Self-test of the release build
        shell: pwsh
        run: |
          cargo build --release --locked
          "{0:N0} bytes" -f (Get-Item target/release/MosaikCapture.exe).Length
          $p = Start-Process target/release/MosaikCapture.exe --self-test -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

  dotnet:
    name: C# capture engine (build, format, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      # The recording tests drive a real ffmpeg (trim, GIF, audio sync)
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Restore (locked)
        run: dotnet restore MosaikCapture.sln --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build MosaikCapture.sln -c Release --no-restore
      - name: Format
        run: dotnet format MosaikCapture.sln --verify-no-changes --no-restore
      # Pixel tests compare UI renders with references; they skip themselves (naming the font) when a
      # reference font such as Segoe UI Variable is missing on the runner image, and use a
      # blur-tolerant comparison here because font versions differ between Windows builds.
      - name: Test
        env:
          MOSAIK_PIXEL_TOLERANCE: lenient
        run: dotnet test MosaikCapture.sln -c Release --no-build --logger "console;verbosity=normal"

  package:
    name: Package
    runs-on: windows-latest
    needs: [rust, dotnet]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build and zip
        shell: pwsh
        run: ./build.ps1 -Package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosaik-capture-win-x64
          path: dist/*.zip

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mosaik-capture-win-x64
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*.zip"
